{% extends "base.html" %}
{% block content %}
<section class="toolbar">
    <input
        type="search"
        name="q"
        placeholder="Suche (Titel, Firma, Ort)..."
        hx-get="/partials/jobs"
        hx-trigger="keyup changed delay:300ms"
        hx-target="#job-list"
        hx-include="[name='status'],[name='source']"
    >
    <select name="status" hx-get="/partials/jobs" hx-trigger="change" hx-target="#job-list" hx-include="[name='q'],[name='source']">
        <option value="">Alle Status</option>
        {% for s in statuses %}
        <option value="{{ s.value }}">{{ s.value }}</option>
        {% endfor %}
    </select>
    <select name="source" hx-get="/partials/jobs" hx-trigger="change" hx-target="#job-list" hx-include="[name='q'],[name='status']">
        <option value="">Alle Quellen</option>
        <option value="arbeitnow">Arbeitnow</option>
        <option value="adzuna">Adzuna</option>
    </select>
    <button
        hx-post="/fetch"
        hx-target="#job-list"
        hx-indicator="#fetch-indicator"
    >Jetzt aktualisieren</button>
    <span id="fetch-indicator" class="htmx-indicator">l&auml;dt neue Jobs (kann etwas dauern)...</span>
</section>

<div id="job-list">
    {% include "partials/job_list.html" %}
</div>
{% endblock %}
