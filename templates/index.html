{% extends "base.html" %}
{% block content %}
<section class="toolbar location-form">
    <input
        type="text"
        name="home_location"
        value="{{ home_location }}"
        placeholder="City or postal code"
        required
    >
    <input
        type="number"
        name="radius_km"
        value="{{ radius_km }}"
        min="1"
        step="1"
        placeholder="Radius (km)"
        required
    >
    <button
        hx-post="/settings/location"
        hx-include="[name='home_location'],[name='radius_km']"
        hx-target="#job-list"
        hx-indicator="#location-indicator"
    >Save &amp; refresh</button>
    <span id="location-indicator" class="htmx-indicator">updating location and fetching jobs...</span>
</section>

<section class="toolbar">
    <input
        type="search"
        name="q"
        placeholder="Search (title, company, location)..."
        hx-get="/partials/jobs"
        hx-trigger="keyup changed delay:300ms"
        hx-target="#job-list"
        hx-include="[name='status'],[name='source']"
    >
    <select name="status" hx-get="/partials/jobs" hx-trigger="change" hx-target="#job-list" hx-include="[name='q'],[name='source']">
        <option value="">All statuses</option>
        {% for s in statuses %}
        <option value="{{ s.value }}">{{ s.value }}</option>
        {% endfor %}
    </select>
    <select name="source" hx-get="/partials/jobs" hx-trigger="change" hx-target="#job-list" hx-include="[name='q'],[name='status']">
        <option value="">All sources</option>
        <option value="arbeitnow">Arbeitnow</option>
        <option value="adzuna">Adzuna</option>
    </select>
    <button
        hx-post="/fetch"
        hx-target="#job-list"
        hx-indicator="#fetch-indicator"
    >Refresh now</button>
    <span id="fetch-indicator" class="htmx-indicator">loading new jobs (may take a moment)...</span>
</section>

<div id="job-list">
    {% include "partials/job_list.html" %}
</div>
{% endblock %}
